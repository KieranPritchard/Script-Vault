services:
  script-vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: script-vault
    volumes:
      - .:/app
    # Network capabilities for raw socket tools (Scapy, Nmap, ARP discovery)
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    command: /bin/bash
    networks:
      - vuln-lab
    depends_on:
      - dvwa

  # Local, disposable test target for upload_probe / vuln_finder.
  # DVWA has a real file-upload form (adjustable difficulty) that
  # discover_upload_form can parse against. Runs on the same
  # docker network as script-vault so it's reachable at http://dvwa:80
  # without exposing it outside this compose stack.
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    depends_on:
      - dvwa-db
    environment:
      - MYSQL_HOST=dvwa-db
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=dvwa_pass
    ports:
      - "127.0.0.1:4280:80"   # loopback-only: not reachable outside this machine
    networks:
      - vuln-lab

  dvwa-db:
    image: mariadb:10.11
    container_name: dvwa-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=dvwa_pass
    volumes:
      - dvwa-db-data:/var/lib/mysql
    networks:
      - vuln-lab

networks:
  vuln-lab:
    driver: bridge

volumes:
  dvwa-db-data: